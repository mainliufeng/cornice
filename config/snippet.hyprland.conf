# Cornice — what to add to ~/.config/hypr/hyprland.conf
#
# Cornice never edits your compositor config. Paste what you want.

# 1. Start the shell with the session.
exec-once = cornice-launch

# 2. Replace the pieces it takes over. Comment these out — do not run both:
#      exec-once = waybar          # the bar
#      exec-once = mako -c ...     # notifications (cornice owns the same bus name)
#    A notification *logger* (dbus-monitor based) can stay: cornice will feed it.

# 3. Keybindings — optional. Nothing here is required: the bar's menu button
#    opens the launcher, clipboard, emoji picker, notifications, bar layout,
#    theme, wallpaper, do-not-disturb, lock and power by click, and every other
#    panel opens from its own bar widget. The panel binds that used to live here
#    were dropped because they only duplicated those clicks — add back whatever
#    you actually reach for.
bind = SUPER, R, exec, cornice launcher
bind = SUPER, N, exec, cornice notifications
bind = SUPER ALT, L, exec, cornice lock
bind = SUPER ALT, R, exec, cornice restart

# Volume keys already work: cornice watches the PipeWire sink, so raising the
# volume with wpctl shows the OSD by itself. Brightness has no such signal —
# have your brightness script report the new level:

#   cornice ipc osd brightness      # after changing it

# Static / per-workspace wallpaper (off while mpvpaper runs; see README):
#   cornice background set ~/Pictures/wall.png
#   cornice background next

# Notes
# -----
# - `cornice doctor` reports anything still in the way (a running waybar, a
#   notification daemon holding org.freedesktop.Notifications, missing fonts).
# - `cornice verify` checks the shell you are actually looking at.
# - Restart after changing shell config: `cornice restart`.
# - Rollback: `cornice stop`, then restore the exec-once lines above.

# 4. Optional: XWayland apps sometimes open their dialogs at 0,0 as floating
#    windows, where the bar covers them (ChatGPT's "Quit ChatGPT?" does this).
#    Float + centre the app that misbehaves — the class below is the *dialog's*,
#    which often differs in case from the main window's:
#      windowrule = float on,  match:class ^(ChatGPT)$
#      windowrule = center on, match:class ^(ChatGPT)$
