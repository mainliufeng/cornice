# Cornice — the two lines you add to ~/.config/hypr/hyprland.conf
#
# Cornice never edits your compositor config. Paste what you want:

# 1. Start the shell with the session.
exec-once = cornice-launch

# 2. Optional keybindings. These assume nothing else uses SUPER + ALT + <key>.
bind = SUPER ALT, R, exec, cornice restart
bind = SUPER ALT, T, exec, cornice theme mono

# Notes
# -----
# - Do not also start waybar/mako/swayosd while trying Cornice out: they will
#   overlap the bar and fight over org.freedesktop.Notifications.
#   Run `cornice doctor` to see what is currently running.
# - Restart after edits to your config or the shell:
#       cornice restart
# - Stop and go back to your old bar for this session:
#       cornice stop
